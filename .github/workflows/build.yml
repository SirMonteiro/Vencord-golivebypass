name: Build DevBuild

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        required: false
        default: 'false'

permissions:
  contents: write

env:
  FORCE_COLOR: true
  VENCORD_REMOTE: ${{ github.repository }}

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Check upstream Vencord commit
        id: check
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/Vendicated/Vencord.git HEAD | cut -f1)
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "Error: Could not retrieve upstream commit hash."
            exit 1
          fi
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "short_sha=${UPSTREAM_SHA:0:7}" >> $GITHUB_OUTPUT

          RELEASE_SHA=$(gh release view devbuild --repo "${{ github.repository }}" --json body --jq .body 2>/dev/null | grep -oE '[a-f0-9]{40}' | head -n1 || echo "")

          echo "Upstream commit: $UPSTREAM_SHA"
          echo "Current release commit: $RELEASE_SHA"

          if [ "$UPSTREAM_SHA" = "$RELEASE_SHA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Upstream has not changed. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New commit or manual trigger detected. Proceeding to build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout official Vencord
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v7
        with:
          repository: Vendicated/Vencord

      - name: Checkout repository
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v7
        with:
          path: custom

      - name: Inject repo custom plugin
        if: steps.check.outputs.should_build == 'true'
        run: |
          mkdir -p src/userplugins/
          find custom -mindepth 1 -maxdepth 1 -type d -exec sh -c 'find "$1" -type f \( -name "*.ts" -o -name "*.tsx" \) | grep -q . && cp -r -t "$1" src/userplugins/' _ {} \;
          rm -rf custom

      - name: Setup pnpm
        if: steps.check.outputs.should_build == 'true'
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@v24
          require-lockfile: true

      - name: Setup interactive ssh session
        uses: Warpbuilds/action-debugger@v2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          limit-access-to-actor: true

      - name: Build web
        if: steps.check.outputs.should_build == 'true'
        run: pnpm buildWebStandalone

      - name: Build
        if: steps.check.outputs.should_build == 'true'
        run: pnpm build --standalone

      - name: Generate plugin list
        if: steps.check.outputs.should_build == 'true'
        run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

      - name: Clean up obsolete files
        if: steps.check.outputs.should_build == 'true'
        run: |
          rm -rf dist/*-unpacked dist/vendor Vencord.user.css vencordDesktopRenderer.css vencordDesktopRenderer.css.map

      - name: Preliminar cleanup
        if: steps.check.outputs.should_build == 'true'
        run: |
          find dist/ -name "*.map" -delete

      - name: Publish DevBuild release
        if: steps.check.outputs.should_build == 'true'
        run: |
          UPSTREAM_SHA="${{ steps.check.outputs.upstream_sha }}"
          RELEASE_TAG="$(git rev-parse --short HEAD)"

          # Delete the existing devbuild release and tag to ensure strictly one release exists
          if gh release view devbuild --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete devbuild --repo "${{ github.repository }}" --yes --cleanup-tag
          fi

          # Upload individual dist/* artifacts matching the official Vencord file structure
          gh release create devbuild dist/* \
            --repo "${{ github.repository }}" \
            --title "DevBuild $RELEASE_TAG" \
            --notes "Official Vencord commit: $UPSTREAM_SHA" \
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
