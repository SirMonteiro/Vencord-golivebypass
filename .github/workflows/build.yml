name: Build DevBuild

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        required: false
        default: 'false'

permissions:
  contents: write

env:
  FORCE_COLOR: true
  # Baked into the build so its built-in updater targets this repository.
  VENCORD_REMOTE: ${{ github.repository }}

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Check for upstream or custom changes
        id: check
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/Vendicated/Vencord.git HEAD | cut -f1)
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "Error: Could not retrieve upstream commit hash."
            exit 1
          fi

          CUSTOM_SHA="${{ github.sha }}"

          # Deterministic build id. It changes when either upstream Vencord moves
          # (new code) or this repository moves (new plugin / workflow changes), so
          # installed clients always detect both kinds of updates.
          VENCORD_HASH=$(printf '%s\n%s\n' "$UPSTREAM_SHA" "$CUSTOM_SHA" | sha1sum | cut -c1-7)

          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "custom_sha=$CUSTOM_SHA" >> "$GITHUB_OUTPUT"
          echo "vencord_hash=$VENCORD_HASH" >> "$GITHUB_OUTPUT"
          echo "VENCORD_HASH=$VENCORD_HASH" >> "$GITHUB_ENV"

          RELEASE_HASH=$(gh release view devbuild --repo "${{ github.repository }}" --json body --jq .body 2>/dev/null \
            | grep -oE 'Vencord hash: [a-f0-9]{7}' | awk '{print $3}' | head -n1 || echo "")

          echo "Upstream commit: $UPSTREAM_SHA"
          echo "Custom commit:   $CUSTOM_SHA"
          echo "Build hash:      $VENCORD_HASH"
          echo "Released hash:   ${RELEASE_HASH:-none}"

          if [ "$VENCORD_HASH" = "$RELEASE_HASH" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Nothing changed since the last release. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream or custom change detected. Proceeding to build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout official Vencord
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v7
        with:
          repository: Vendicated/Vencord

      - name: Checkout this repository (custom plugins + CI scripts)
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v7
        with:
          path: custom

      - name: Patch updater to target this repository
        if: steps.check.outputs.should_build == 'true'
        run: node custom/.github/scripts/patch-updater.mjs

      - name: Inject custom userplugins
        if: steps.check.outputs.should_build == 'true'
        run: |
          mkdir -p src/userplugins
          for dir in custom/*/; do
            [ -d "$dir" ] || continue
            if find "$dir" -type f \( -name '*.ts' -o -name '*.tsx' \) | grep -q .; then
              echo "Injecting $dir"
              cp -r "$dir" src/userplugins/
            fi
          done
          rm -rf custom

      - name: Setup pnpm
        if: steps.check.outputs.should_build == 'true'
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@v24
          require-lockfile: true

      - name: Setup interactive ssh session
        uses: Warpbuilds/action-debugger@v2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Build web
        if: steps.check.outputs.should_build == 'true'
        run: pnpm buildWebStandalone

      - name: Build desktop / Discord
        if: steps.check.outputs.should_build == 'true'
        run: pnpm build --standalone

      - name: Generate plugin list
        if: steps.check.outputs.should_build == 'true'
        run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

      - name: Clean up obsolete files
        if: steps.check.outputs.should_build == 'true'
        run: |
          rm -rf dist/*-unpacked dist/vendor
          find dist -name '*.map' -delete

      - name: Publish DevBuild release
        if: steps.check.outputs.should_build == 'true'
        run: |
          UPSTREAM_SHA="${{ steps.check.outputs.upstream_sha }}"
          CUSTOM_SHA="${{ steps.check.outputs.custom_sha }}"
          VENCORD_HASH="${{ steps.check.outputs.vencord_hash }}"

          # Keep exactly one release so /releases/latest always points at the newest build.
          if gh release view devbuild --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete devbuild --repo "${{ github.repository }}" --yes --cleanup-tag
          fi

          NOTES="Official Vencord commit: $UPSTREAM_SHA"
          NOTES="${NOTES}"$'\n'"Custom repo commit: $CUSTOM_SHA"
          NOTES="${NOTES}"$'\n'"Vencord hash: $VENCORD_HASH"

          gh release create devbuild dist/* \
            --repo "${{ github.repository }}" \
            --title "DevBuild $VENCORD_HASH" \
            --notes "$NOTES"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
